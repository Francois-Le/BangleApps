# Keep this fork in sync with espruino/BangleApps (master), once a day.
# Our own apps live in their own folders (e.g. apps/retrowatch), so the merge is normally conflict-free.
# If it fails (merge conflict, or upstream changed files under .github/workflows which GITHUB_TOKEN
# is not allowed to push), use the "Sync fork" button on GitHub or merge manually.
name: Sync upstream

on:
  schedule:
    - cron: "17 4 * * *"   # daily, 04:17 UTC
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  sync:
    if: github.repository != 'espruino/BangleApps'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout fork
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Merge upstream master
        id: merge
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/espruino/BangleApps.git
          git fetch --no-tags upstream master
          if git merge-base --is-ancestor upstream/master HEAD; then
            echo "Already up to date."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git merge --no-edit upstream/master -m "Merge upstream espruino/BangleApps master"
          git push origin HEAD:master
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Rebuild GitHub Pages
        if: steps.merge.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds" || echo "Pages build request failed (it may already be building)."
